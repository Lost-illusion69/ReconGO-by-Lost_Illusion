name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ------------------------------------------------------------------
  # 1. Build & Unit Tests
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go: ["1.22", "1.23"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module graph
        run: go mod verify

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build all packages
        run: go build ./...

      - name: Run tests with race detector
        run: go test -race -count=1 -timeout 120s ./...

      - name: Check module is tidy
        run: |
          go mod tidy
          # go.sum only exists when there are external dependencies.
          # For a stdlib-only module it is absent; skip the diff in that case.
          if [ -f go.sum ]; then
            git diff --exit-code go.sum
          fi

  # ------------------------------------------------------------------
  # 2. Static Analysis / Linting
  # ------------------------------------------------------------------
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8   # pin to latest stable v1 release
          args: --timeout 5m --config .golangci.yml

  # ------------------------------------------------------------------
  # 3. Docker Image Build (smoke-test the multi-stage Dockerfile)
  # ------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: recongo:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
